name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest