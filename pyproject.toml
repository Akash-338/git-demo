[project]
name = "workshop-demo-repo"
version = "1.0.0"
description = "Demo repository for Git, GitHub, and GitHub Actions workshop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "colorama==0.4.6",
    "pyfiglet==1.0.4",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.8.0",
    "pytest==9.1.1",
    "pytest-cov==6.1.1",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-report=lcov"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG"]
